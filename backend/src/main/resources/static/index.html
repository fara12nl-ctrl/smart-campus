<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Campus - Integrated Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="logo">SC</div>
    <h1>Smart Campus</h1>
    <p class="muted">Integrated Management System</p>
    <form id="login-form">
      <label>Username
        <input id="login-username" autocomplete="username" required>
      </label>
      <label>Password
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary" type="submit">Sign In</button>
      <p class="hint">Demo login: admin / admin123</p>
    </form>
    <div id="login-error" class="error hidden"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo sm">SC</span>
      <div><strong>Smart Campus</strong><small>Management</small></div>
    </div>
    <nav id="nav">
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="students">Students</button>
      <button data-view="faculty">Faculty</button>
      <button data-view="courses">Courses</button>
      <button data-view="resources">Classrooms &amp; Labs</button>
      <button data-view="equipment">Equipment</button>
      <button data-view="events">Campus Events</button>
      <button data-view="bookings">Resource Booking</button>
      <button data-view="demo">Thread Demo</button>
    </nav>
    <div class="sidebar-footer">
      <div id="user-chip" class="user-chip"></div>
      <button id="logout-btn" class="btn ghost">Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <p id="page-sub" class="muted">Welcome back</p>
      </div>
      <div id="clock" class="clock"></div>
    </header>

    <section id="view-dashboard" class="view"></section>

    <section id="view-crud" class="view hidden">
      <div class="toolbar">
        <input id="search-box" placeholder="Search...">
        <button id="add-btn" class="btn primary">Add New</button>
      </div>
      <div id="table-wrap" class="table-wrap"></div>
    </section>

    <section id="view-demo" class="view hidden"></section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
