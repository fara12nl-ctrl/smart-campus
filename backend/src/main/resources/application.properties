server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/smart_campus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.jackson.default-property-inclusion=non_null
logging.level.org.springframework.jdbc.core=WARN
