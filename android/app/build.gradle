plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartcampus.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.smartcampus.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("../smartcampus-release.jks")
            storePassword "smartcampus123"
            keyAlias "smartcampus"
            keyPassword "smartcampus123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
